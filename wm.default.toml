# wm configuration — all settings below show the built-in defaults.
# Created at %APPDATA%\wm\config.toml on first start, or by `wm config init`.
# Save this file to reload. Invalid edits keep the last working configuration.
# Missing settings use these defaults; unknown settings are errors (catches typos).
# Pixels are physical screen pixels. No restart or rebuild is needed.
# Use `wm config check` to validate without rearranging the desktop.

# Named workspaces, top to bottom. They stay even when empty, so window rules
# and setups can send windows to them, e.g. ["web", "chat", "code"]. Alt+1..9
# still count from the top. Unnamed workspaces below them come and go as usual.
workspaces = []

[layout]
# Gap between columns AND around the outside of the tiled area, in pixels.
gap = 8
# Widths are exact fractions of the viewport, including their share of gaps.
# Default width affects newly tiled windows without an explicit/remembered width.
default_width = "1/2"
# Alt+R cycles these in increasing order, then wraps to the first.
width_presets = ["1/3", "1/2", "2/3"]
# Minimum column width and amount added/removed by a resize key, in percent.
min_width_percent = 10
resize_step_percent = 10
# Extra space inside Windows' work area (which already excludes the taskbar).
# For wm-bar's default height, set reserved_top = 28. Keep it equal to bar.height
# in bar.toml. Reserved space remains when the separate bar is closed.
reserved_top = 0
reserved_bottom = 0
reserved_left = 0
reserved_right = 0

[behavior]
# Wrap at the ends for focus keys and move keys, respectively.
wrap_focus = true
wrap_move = true
# Learn each executable + window class's last mode and column width.
# Learned values stay in rules.txt and are written on graceful exit only.
# Turning either off also stops using its learned values; it does not erase them.
remember_modes = true
remember_widths = true
# Open dialog-like windows floating, as niri does: ones that can't be resized,
# or use the standard dialog class. Rules and learned modes still win.
float_dialogs = true
# Raise floating windows above tiled windows when a tiled window takes focus.
floating_above_tiled = true
# Print window events and hotkey actions to the console. Errors always print.
log_events = true
# The setup (see [setups] below) to load when wm starts, or "" for none.
startup_setup = ""

[agent]
# Actions accepted from `wm do`. Hotkeys and bar commands are unaffected.
# Unknown or repeated names reject the whole configuration. Close and quit
# can be added explicitly; the running WM checks this list on every request.
allow = [
    "focus_left", "focus_right", "focus_up", "focus_down",
    "move_left", "move_right", "move_up", "move_down",
    "workspace_1", "workspace_2", "workspace_3", "workspace_4", "workspace_5",
    "workspace_6", "workspace_7", "workspace_8", "workspace_9",
    "send_1", "send_2", "send_3", "send_4", "send_5", "send_6", "send_7", "send_8", "send_9",
    "cycle_width", "resize_narrower", "resize_wider", "toggle_full",
    "toggle_float", "toggle_sticky", "toggle_top", "overview", "reload",
]

[animations]
# Presentation only: keyboard focus and window placement never wait for it.
# Windows move on springs, as in niri: they ease in and out, and a key pressed
# mid-move bends the motion toward the new place instead of restarting it.
# Set false for instant switching everywhere; saving takes effect live.
enabled = true

[animations.horizontal]
# Column scrolling/reordering on the current workspace. Width changes are instant.
enabled = true
# Milliseconds for a move to settle, 0 to 2000. Most of it happens in the
# first half; the rest is the ease-out. Zero disables this effect.
duration_ms = 300

[animations.workspaces]
# Vertical slides, including numbered workspace jumps and send-and-follow.
enabled = true
duration_ms = 300

[animations.overview]
# Zoom between the desktop and overview; animate cards as its layout changes.
enabled = true
duration_ms = 300

[overview]
# Standard #RRGGBB colors.
background = "#000000"
workspace = "#202020"
active_workspace = "#404040"
card = "#606060"
highlight = "#FFFFFF"
# Focused card's border thickness in pixels (0 disables it).
highlight_width = 3
# Vertical screen margin, row gap, and maximum row height, as fractions.
# These scale with the screen. Rows shrink further when there are many workspaces.
margin = "1/20"
row_gap = "1/40"
max_row_height = "1/3"
# Inside overview, also accept configured hotkeys with Alt removed (except quit).
bare_hotkeys = true
# Arrow keys directly focus; Shift+arrows move. Ctrl+arrows do nothing.
arrow_keys = true
# Enter and Escape close the overview on the highlighted window.
enter_escape_close = true

[hotkeys]
# Bindings call actions directly in this process. No shell commands are spawned.
# Omitted actions retain these defaults. Set an action to "" to disable it,
# except quit, which must remain bound. Duplicate key combinations are errors.
# A list binds several keys to one action: focus_left = ["Alt+H", "Alt+A"].
# Modifiers: Alt, Ctrl, Shift, Win. Keys: A-Z, 0-9, F1-F24, arrows, Space,
# Tab, Enter, Escape, Backspace, Delete, Insert, Home, End, PageUp, PageDown,
# Minus, Equals, Comma, Period, Semicolon, Slash, Backslash, LeftBracket,
# RightBracket, Quote, Backtick. Case and modifier order do not matter.
focus_left = "Alt+H"
focus_right = "Alt+L"
focus_up = "Alt+K"
focus_down = "Alt+J"
move_left = "Alt+Shift+H"
move_right = "Alt+Shift+L"
move_up = "Alt+Shift+K"
move_down = "Alt+Shift+J"
# Workspaces are numbered from the top; past the last one selects the empty one.
workspace_1 = "Alt+1"
workspace_2 = "Alt+2"
workspace_3 = "Alt+3"
workspace_4 = "Alt+4"
workspace_5 = "Alt+5"
workspace_6 = "Alt+6"
workspace_7 = "Alt+7"
workspace_8 = "Alt+8"
workspace_9 = "Alt+9"
# Send the focused tiled/floating window to that workspace and follow it.
send_1 = "Alt+Shift+1"
send_2 = "Alt+Shift+2"
send_3 = "Alt+Shift+3"
send_4 = "Alt+Shift+4"
send_5 = "Alt+Shift+5"
send_6 = "Alt+Shift+6"
send_7 = "Alt+Shift+7"
send_8 = "Alt+Shift+8"
send_9 = "Alt+Shift+9"
cycle_width = "Alt+R"
resize_narrower = "Alt+Minus"
resize_wider = "Alt+Equals"
toggle_full = "Alt+F"
toggle_float = "Alt+T"
toggle_sticky = "Alt+Shift+T"
toggle_top = "Ctrl+Alt+Shift+T"
overview = "Alt+O"
close = "Alt+Shift+W"
quit = "Alt+Shift+E"
# Optional manual reload; automatic reload always stays enabled.
reload = "Alt+Shift+R"

# Explicit app rules: none by default. Uncomment a [[window_rules]] block to add one.
# Rules apply when a window joins (startup, open, or restore), so saving a rule
# does not unexpectedly move existing windows or replace their current modes.
# First matching rule wins. All supplied match conditions must match.
# exe: exact filename, case insensitive; class: exact; title_contains: substring.
# At least one match condition and one setting are required. Omitted settings
# fall back to remembered values (if enabled), then the layout defaults.
# mode: "tiled", "float", "sticky", "top", or "ignore" (leave the window alone).
# width: column width in pixels, clamped to layout limits. full_width: bool.
# workspace: a name from `workspaces`, or a number from 1 at the top; past the
# last one opens a new workspace. focus: false places the window there without
# switching the view or giving it the keyboard (default true).
# Explicit rules are never rewritten by wm. Keyboard changes still work for the
# current window; the explicit rule takes priority the next time one joins.
#
# [[window_rules]]
# exe = "scrcpy.exe"
# class = "SDL_app"
# mode = "float"
# width = 640
# full_width = false
#
# [[window_rules]]
# exe = "example.exe"
# title_contains = "Settings"
# mode = "ignore"
#
# [[window_rules]]
# exe = "Discord.exe"
# workspace = "chat"
# focus = false

# Setups: none by default. A setup is a list of apps, each with the workspace,
# mode and width it belongs at. Its key loads it: open windows of its apps
# move into place, left to right in list order, and apps without a window are
# launched and placed as their windows appear, without taking focus. Other
# windows stay where they are.
# key / save_key: hotkeys, one string or a list, like [hotkeys].
# apps: each takes exe, class and title_contains to match windows (as in
# window_rules), run (a path, a program name, a shortcut or a URL; exe
# defaults to its file name) and args to launch it, and workspace, mode, width
# and full_width as in window_rules. Without workspace it goes to the one on
# screen; without mode or width it keeps what it has.
# A setup without apps keeps them in setups.toml beside this file, which its
# save_key rewrites from the layout as it is: every window, its workspace,
# column order, mode and width. save_key needs a setup without apps here.
#
# [setups.work]
# key = "Ctrl+Alt+1"
# apps = [
#     { run = "firefox.exe", workspace = "web", width = 1264 },
#     { run = "wezterm-gui.exe", workspace = "code" },
#     { exe = "Discord.exe", run = "C:/Users/me/AppData/Local/Discord/Update.exe", args = "--processStart Discord.exe", workspace = "chat" },
# ]
#
# [setups.saved]
# key = "Ctrl+Alt+2"
# save_key = "Ctrl+Alt+Shift+2"
